version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: cpcms
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cpcms"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgrespassword@db:5432/cpcms
      SECRET_KEY: docker-compose-super-secret-key-cpcms
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      FACULTY_INVITE_CODE: FACULTY2026
      ALLOWED_EMAIL_DOMAINS: ""
      STUDENT_REG_PATTERN: "^[0-9]{2}[A-Z]{3}[0-9]{4}$"
      UPLOAD_DIR: "/app/uploads"
      CORS_ORIGINS: "http://localhost:80,http://localhost:5173,http://localhost"
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
